[bar.default]
capsule_radius = 8
capsule_thickness = 0.99999998137354851
center = [ "group:g1" ]
color = "secondary"
end = [ "tray", "widget_2", "notifications", "clock", "session" ]
font_family = "Monocraft"
font_weight = 600
icon_color = "primary"
margin_edge = 2
margin_ends = 68
padding = 12
panel_overlap = 0
radius = 6
start = [ "launcher", "workspaces", "volume", "brightness", "battery" ]
thickness = 25
widget_spacing = 15

    [bar.default.dead_zone.actions]
    left = "exec niri msg action toggle-overview"
    middle = "none"

    [[bar.default.capsule_group]]
    border = ""
    enabled = true
    fill = "surface"
    id = "g1"
    members = [ "cpu", "ram", "network_rx" ]
    opacity = 1.0
    padding = 8.0
    radius = 12.0

[battery]
warning_threshold = 20

[calendar]
enabled = true

    [calendar.account.nikitaparshutkin26]
    server_url = "https://ivo.lv.tab.digital/remote.php/dav"

[control_center]
sidebar = "full"
width = 750

    [control_center.calendar]
    show_events_card = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1200.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 128.0
    box_width = 720.0
    cx = 960.0
    cy = 860.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 128.0
    box_width = 720.0
    cx = 960.0
    cy = 860.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 416.0
    cx = 960.0
    cy = 300.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 224.0
    box_width = 416.0
    cx = 960.0
    cy = 300.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

[notification]
filter_order = [ "filter" ]
layer = "overlay"

[plugin_settings."aabidk20/yt-music"]
mini_open_near_click = true
mini_placement = "attached"

[plugin_settings."avivbintangaringga/nix-monitor"]
branch = "nixos-26.05"
clean_command = "nix-collect-garbage -d"
update_command = ""

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/nixos/Wallpapers"

[plugin_settings."radimous/prismlauncher-instances"]
prism_path = "~/.local/share/PrismLauncher"

[plugins]
enabled = [ "radimous/prismlauncher-instances", "aabidk20/yt-music", "noctalia/bitwarden", "noctalia/timer" ]

[shell]
clipboard_enabled = false
font_family = "JetBrainsMono Nerd Font"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = false

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "US"
    Georgian = "GE"
    Russian = "RU"

    [shell.launcher]
    app_grid = true
    categories = false
    pinned = [ "zen-beta", "obsidian", "ferdium", "com.usebottles.bottles", "org.prismlauncher.PrismLauncher" ]

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = false

        [shell.launcher.providers.wallpaper]
        global = true

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

[system.monitor]
disk_poll_seconds = 0

[theme]
builtin = "Eldritch"
community_palette = "Kanagawa Paper"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = []
    enable_community_templates = false

[wallpaper]
directory = "~/nixos-config/Wallpapers"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

    [wallpaper.last]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

    [wallpaper.monitors.DP-1]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

[widget.battery]
color = "secondary"
device = "/org/freedesktop/UPower/devices/battery_BAT0"
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
color = "secondary"
tooltip_format = "{:%a, %d/%m/%Y %H:%M:%S}"

    [widget.clock.actions]
    right = "panel-toggle noctalia/timer:panel"

[widget.cpu]
display = "text"
visualization = "none"

[widget.launcher]
capsule_radius = "auto"
icon_color = "primary"
scale = 1.2

[widget.network]
enabled = true
show_label = false

[widget.network_rx]
display = "text"
network_speed_compact = true
network_speed_unit = "mb"
show_label = false
visualization = "none"

[widget.ram]
display = "text"
visualization = "none"

[widget.sysmon]
stat = "ram_pct"

[widget.widget]
scale = 1.1500000000000001
type = "aabidk20/yt-music:widget"

[widget.widget_2]
scale = 1.25
type = "aabidk20/yt-music:widget"
