[bar.default]
capsule_radius = 8
capsule_thickness = 0.99999998137354851
center = [ "group:g1", "nix-monitor" ]
color = "secondary"
end = [ "notifications", "brightness", "clock", "session" ]
font_family = "Monocraft"
font_weight = 600
icon_color = "primary"
margin_edge = 2
margin_ends = 68
padding = 12
panel_overlap = 0
radius = 6
start = [ "launcher", "workspaces", "volume", "battery", "tray" ]
thickness = 25
widget_spacing = 15

    [[bar.default.capsule_group]]
    border = ""
    enabled = true
    fill = "surface"
    id = "g1"
    members = [ "cpu", "ram", "network_rx" ]
    opacity = 1.0
    padding = 8.0
    radius = 12.0

[battery]
warning_threshold = 20

[control_center]
sidebar = "full"
width = 750

    [control_center.calendar]
    show_events_card = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1200.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 905.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 416.0
    cx = 960.0
    cy = 300.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

[notification]
filter_order = [ "filter" ]
layer = "overlay"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/nixos-config/Wallpapers"

[plugin_settings."radimous/prismlauncher-instances"]
prism_path = "~/.local/share/PrismLauncher"

[plugins]
enabled = [ "radimous/prismlauncher-instances" ]

[shell]
clipboard_enabled = false
font_family = "JetBrainsMono Nerd Font"
password_style = "random"
screen_time_enabled = true

    [shell.launcher]
    app_grid = true

        [shell.launcher.providers.session]
        global = false

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

[system.monitor]
disk_poll_seconds = 0

[theme]
builtin = "Eldritch"
community_palette = "Kanagawa Paper"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = []

[wallpaper]
directory = "~/nixos-config/Wallpapers"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

    [wallpaper.last]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

    [wallpaper.monitors.DP-1]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/nikita/nixos-config/Wallpapers/kanagawa-paper/brown_city_planet.png"

[widget.battery]
color = "secondary"
device = "/org/freedesktop/UPower/devices/battery_BAT0"
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.clock]
color = "secondary"
tooltip_format = "{:%a, %d/%m/%Y %H:%M:%S}"

[widget.cpu]
display = "text"

[widget.launcher]
capsule_radius = 8
icon_color = "primary"
scale = 1.2

[widget.network]
enabled = true
show_label = false

[widget.network_rx]
display = "text"
network_speed_compact = true
network_speed_unit = "mb"
show_label = false

[widget.ram]
display = "text"

[widget.sysmon]
stat = "ram_pct"
